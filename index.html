<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── PWA básico ─────────────────────────────────────── -->
    <title>Pet Gestor</title>
    <meta name="description" content="Sistema PDV para Petshop e Agroshop" />
    <meta name="theme-color" content="#0d1b2a" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── Favicon ───────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/pwa-128x128.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/pwa-72x72.png" />

    <!-- ── iOS / Safari PWA ──────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pet Gestor" />
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/pwa-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/pwa-192x192.png" />

    <!-- iOS splash screens (portrait) -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
          href="/icons/pwa-512x512.png" />
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
          href="/icons/pwa-384x384.png" />

    <!-- ── Android / Chrome ──────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Pet Gestor" />

    <!-- ── Microsoft Tiles ───────────────────────────────── -->
    <meta name="msapplication-TileColor" content="#0d1b2a" />
    <meta name="msapplication-TileImage" content="/icons/pwa-144x144.png" />

    <!-- ── Open Graph (compartilhamento) ─────────────────── -->
    <meta property="og:title" content="Pet Gestor" />
    <meta property="og:description" content="PDV completo para Petshop e Agroshop" />
    <meta property="og:image" content="/icons/pwa-512x512.png" />
    <meta property="og:type" content="website" />

    <!-- Prevent zoom on input focus (iOS) -->
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      input, select, textarea { font-size: 16px !important; } /* evita zoom no iOS */
      body { margin: 0; overscroll-behavior: none; } /* sem pull-to-refresh acidental */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
